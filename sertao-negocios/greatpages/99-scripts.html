<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script>
/**
 * Configuração da captação de leads do Sertão Negócios.
 * Preencha antes de publicar. Veja o README para exemplos de integração.
 */
window.SN_CONFIG = {
  // URL que recebe o POST do formulário (webhook do CRM, Make/Zapier, Google Apps Script, RD Station etc.).
  // Vazio = modo de demonstração: o envio é simulado e um aviso aparece no console.
  leadEndpoint: '',

  // 'json' envia application/json; 'form' envia application/x-www-form-urlencoded
  // (use 'form' + requestMode 'no-cors' para Google Apps Script e webhooks sem CORS).
  payloadFormat: 'json',
  requestMode: 'cors',

  // Opcional: após o envio, redireciona para esta URL (página de obrigado, grupo de WhatsApp etc.).
  redirectUrl: '',
  redirectDelayMs: 2200
};
</script>
<script>
{
/* =========================================================
   Sertão Negócios 2026 · interações e animações
   Lenis (scroll suave) + GSAP / ScrollTrigger / SplitText / DrawSVG
   ========================================================= */
const __snRun = () => {
  'use strict';

  const root = document.documentElement;
  const CFG = window.SN_CONFIG || {};
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasGSAP = !!(window.gsap && window.ScrollTrigger);
  const motion = hasGSAP && !reduceMotion;
  const $ = (s, c = document) => c.querySelector(s);
  const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));

  if (!motion) root.classList.add('sn-no-motion');

  /* ---------- Mensuração ---------- */
  const track = (event, params = {}) => {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event, ...params });
    if (typeof window.gtag === 'function') window.gtag('event', event, params);
  };

  /* ---------- Lenis + ScrollTrigger ---------- */
  let lenis = null;
  if (motion) {
    gsap.registerPlugin(ScrollTrigger);
    if (window.SplitText) gsap.registerPlugin(SplitText);
    if (window.DrawSVGPlugin) gsap.registerPlugin(DrawSVGPlugin);

    if (window.Lenis) {
      lenis = new Lenis({
        duration: 1.15,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        smoothWheel: true,
        touchMultiplier: 1.4
      });
      window.__snLenis = lenis;
      lenis.on('scroll', ScrollTrigger.update);
      gsap.ticker.add((time) => lenis.raf(time * 1000));
      gsap.ticker.lagSmoothing(0);
    }
  }

  const navHeight = () => ($('[data-nav]')?.offsetHeight || 72);

  const scrollToTarget = (target, onDone) => {
    if (lenis) {
      lenis.scrollTo(target, { offset: target.id === 'inicio' ? 0 : -navHeight() + 1, duration: 1.5, onComplete: onDone });
    } else {
      target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      if (onDone) setTimeout(onDone, reduceMotion ? 0 : 700);
    }
  };

  /* ---------- Âncoras, CTAs e pré-seleção de interesse ---------- */
  const setInterest = (value) => {
    const radio = $(`input[name="interesse"][value="${value}"]`);
    if (radio) {
      radio.checked = true;
      radio.closest('.sn-field')?.classList.remove('sn-is-invalid');
      const err = $('#e-interesse'); if (err) err.textContent = '';
    }
  };

  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#"]');
    if (!link) return;
    const id = link.getAttribute('href').slice(1);
    const target = id ? document.getElementById(id) : null;
    if (!target) return;
    e.preventDefault();

    if (link.dataset.interest) setInterest(link.dataset.interest);
    if (link.dataset.cta) track('cta_click', { cta_location: link.dataset.cta, cta_text: link.textContent.trim() });

    scrollToTarget(target, () => {
      // Move o foco para o destino sem rolar de novo (navegação por teclado / leitores de tela).
      const focusEl = id === 'inscricao' ? $('#signup-title') : target;
      if (!focusEl.hasAttribute('tabindex')) focusEl.setAttribute('tabindex', '-1');
      focusEl.focus({ preventScroll: true });
    });
    if (history.replaceState) history.replaceState(null, '', `#${id}`);
  });

  /* ---------- Navegação: tema por seção, esconder ao rolar, dock mobile ---------- */
  const nav = $('[data-nav]');
  const dock = $('[data-dock]');
  const hero = $('.sn-hero');
  const signup = $('#inscricao');
  const themed = $$('[data-theme]');
  let lastY = window.scrollY;
  let ticking = false;

  const onScroll = () => {
    const y = window.scrollY;
    const probe = navHeight() / 2;

    nav.classList.toggle('sn-is-scrolled', y > 40);
    const goingDown = y > lastY;
    nav.classList.toggle('sn-is-hidden', goingDown && y > window.innerHeight * .9 && !nav.matches(':focus-within'));
    lastY = y;

    for (const sec of themed) {
      const r = sec.getBoundingClientRect();
      if (r.top <= probe && r.bottom > probe) { nav.classList.toggle('sn-is-light', sec.dataset.theme === 'light'); break; }
    }

    if (dock && hero && signup) {
      const pastHero = hero.getBoundingClientRect().bottom < window.innerHeight * .25;
      const s = signup.getBoundingClientRect();
      const formInView = s.top < window.innerHeight && s.bottom > 0;
      dock.classList.toggle('sn-is-visible', pastHero && !formInView);
    }
    ticking = false;
  };
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  onScroll();

  /* ---------- Brilho que segue o cursor nos botões ---------- */
  if (window.matchMedia('(hover: hover)').matches) {
    document.addEventListener('pointermove', (e) => {
      const btn = e.target.closest?.('.sn-btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', `${((e.clientX - r.left) / r.width) * 100}%`);
      btn.style.setProperty('--my', `${((e.clientY - r.top) / r.height) * 100}%`);
    }, { passive: true });
  }

  /* ---------- Friso regional: completa a faixa para o loop ---------- */
  $$('.sn-frieze__track').forEach((track) => {
    const set = $('.sn-frieze__set', track);
    if (!set) return;
    const copies = Math.max(2, Math.ceil((window.innerWidth * 2) / Math.max(set.scrollWidth, 1)) + 1);
    for (let i = 1; i < copies; i++) track.appendChild(set.cloneNode(true));
  });

  /* ---------- Formulário ---------- */
  initForm();
  initPrivacy();

  if (!motion) return;

  /* =========================================================
     ANIMAÇÕES (somente com GSAP e movimento permitido)
     ========================================================= */
  const mm = gsap.matchMedia();

  /* ---------- Hero: coreografia de entrada ---------- */
  $$('[data-hero]').forEach((el) => { el.style.animation = 'none'; });
  const topoPaths = $$('[data-topo] path');
  const intro = gsap.timeline({ defaults: { ease: 'expo.out', duration: 1.4 }, delay: .1 });
  intro
    .fromTo('[data-hero="logo"]', { opacity: 0, y: 70, scale: .94, rotateX: 18, transformPerspective: 900 },
      { opacity: 1, y: 0, scale: 1, rotateX: 0, duration: 1.8 }, 0)
    .fromTo('[data-hero="kicker"]', { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, .25)
    .fromTo('[data-hero="meta"]', { opacity: 0, x: 30 }, { opacity: 1, x: 0 }, .55)
    .fromTo(['[data-hero="lead"]', '[data-hero="sub"]', '[data-hero="cta"]', '[data-hero="note"]'],
      { opacity: 0, y: 26 }, { opacity: 1, y: 0, stagger: .09 }, .6)
    .from('.sn-hero__frieze', { opacity: 0, y: 24, duration: 1.2 }, .9)
    .from('.sn-hero__horizon', { opacity: 0, y: 40, duration: 2 }, 0);
  if (window.DrawSVGPlugin && topoPaths.length) {
    intro.fromTo(topoPaths, { drawSVG: '50% 50%' }, { drawSVG: '0% 100%', duration: 2.4, ease: 'power2.inOut', stagger: { each: .05, from: 'end' } }, 0);
  }

  // Hero → manifesto: profundidade em camadas
  gsap.set('.sn-hero__topo', { xPercent: -50, yPercent: -50, x: 0, y: 0 });
  gsap.timeline({ scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } })
    .to('.sn-hero__inner', { yPercent: -14, opacity: .15, ease: 'none' }, 0)
    .to('.sn-hero__horizon', { yPercent: 12, ease: 'none' }, 0)
    .to('.sn-hero__topo', { scale: 1.25, rotate: 6, ease: 'none' }, 0)
    .fromTo('.sn-hero__frieze', { yPercent: 0, opacity: 1 }, { yPercent: 120, opacity: 0, ease: 'none', immediateRender: false }, 0);

  /* ---------- Títulos: revelação por linhas com máscara ---------- */
  if (window.SplitText) {
    $$('[data-split]').forEach((el) => {
      SplitText.create(el, {
        type: 'lines', mask: 'lines', linesClass: 'sn-split-line', autoSplit: true,
        onSplit: (self) => gsap.from(self.lines, {
          yPercent: 110, duration: 1.25, ease: 'expo.out', stagger: .09,
          scrollTrigger: { trigger: el, start: 'top 86%', toggleActions: 'play none none none' }
        })
      });
    });

    // Manifesto: palavras acendem conforme a leitura avança
    const manifesto = $('[data-words]');
    if (manifesto) {
      SplitText.create(manifesto, {
        type: 'words', wordsClass: 'sn-w', autoSplit: true,
        onSplit: (self) => gsap.fromTo(self.words, { opacity: .14 }, {
          opacity: 1, ease: 'none', stagger: .1,
          scrollTrigger: { trigger: manifesto, start: 'top 78%', end: 'bottom 42%', scrub: .6 }
        })
      });
    }

    // Nomes dos palestrantes
    $$('.sn-speaker__name').forEach((el) => {
      SplitText.create(el, {
        type: 'lines', mask: 'lines', autoSplit: true,
        onSplit: (self) => gsap.from(self.lines, {
          yPercent: 105, duration: 1.2, ease: 'expo.out', stagger: .1,
          scrollTrigger: { trigger: el, start: 'top 92%' }
        })
      });
    });
  }

  /* ---------- Revelação genérica ---------- */
  gsap.set('[data-reveal]', { opacity: 0, y: 40 });
  ScrollTrigger.batch('[data-reveal]', {
    start: 'top 90%',
    once: true,
    onEnter: (batch) => gsap.to(batch, {
      opacity: 1, y: 0, duration: 1.15, ease: 'expo.out', stagger: .08, clearProps: 'transform,opacity'
    })
  });

  /* ---------- Revelação de imagens com máscara ---------- */
  $$('[data-img-reveal]').forEach((wrap) => {
    const img = $('img', wrap);
    gsap.timeline({ scrollTrigger: { trigger: wrap, start: 'top 85%' } })
      .fromTo(wrap, { clipPath: 'inset(100% 0% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.4, ease: 'expo.inOut' }, 0)
      .fromTo(img, { scale: 1.35 }, { scale: 1, duration: 2, ease: 'expo.out' }, .1);
  });

  /* ---------- Desenho de linhas SVG ---------- */
  if (window.DrawSVGPlugin) {
    $$('.sn-vis .sn-draw, .sn-benefit__icon .sn-draw').forEach((g) => {
      const paths = g.matches('path') ? [g] : $$('path, rect, circle', g);
      gsap.fromTo(paths, { drawSVG: '0%' }, {
        drawSVG: '100%', duration: 2, ease: 'power2.inOut', stagger: .15,
        scrollTrigger: { trigger: g.closest('.sn-chapter, .sn-benefit') || g, start: 'top 70%' }
      });
    });
  }

  /* ---------- História: sticky storytelling ---------- */
  const rail = $$('.sn-story__rail li');
  $$('.sn-chapter').forEach((ch, i) => {
    ScrollTrigger.create({
      trigger: ch, start: 'top 55%', end: 'bottom 55%',
      onToggle: (self) => { if (self.isActive) rail.forEach((li, j) => li.classList.toggle('sn-is-active', j === i)); }
    });
  });

  mm.add('(min-width: 900px)', () => {
    $$('.sn-chapter').forEach((ch) => {
      const vis = $('.sn-vis', ch);
      const text = $('.sn-chapter__text', ch);
      gsap.fromTo(vis, { scale: .82, borderRadius: '48px', opacity: .4 }, {
        scale: 1, borderRadius: '20px', opacity: 1, ease: 'none',
        scrollTrigger: { trigger: ch, start: 'top bottom', end: 'top 25%', scrub: true }
      });
      gsap.fromTo(vis, { scale: 1, opacity: 1 }, {
        scale: .9, opacity: .25, ease: 'none', immediateRender: false,
        scrollTrigger: { trigger: ch, start: 'bottom 95%', end: 'bottom 35%', scrub: true }
      });
      gsap.fromTo(text, { y: 60 }, { y: -60, ease: 'none', scrollTrigger: { trigger: ch, start: 'top bottom', end: 'bottom top', scrub: true } });
    });
    const sun = $('.sn-vis__sun');
    if (sun) gsap.to(sun, { rotate: 120, ease: 'none', scrollTrigger: { trigger: sun.closest('.sn-chapter'), start: 'top bottom', end: 'bottom top', scrub: true } });
  });

  gsap.from('.sn-stands .sn-mod', {
    opacity: 0, y: 30, scale: .8, transformOrigin: '50% 100%', duration: .9, ease: 'back.out(1.7)', stagger: { each: .05, from: 'random' },
    scrollTrigger: { trigger: '.sn-stands', start: 'top 80%' }
  });
  gsap.from('.sn-boiada', { opacity: 0, duration: 1.2, scrollTrigger: { trigger: '.sn-vis--rios', start: 'top 60%' } });

  gsap.from('.sn-sectors li', {
    opacity: 0, y: 24, scale: .9, duration: .9, ease: 'back.out(1.6)', stagger: .07,
    scrollTrigger: { trigger: '.sn-vis--setores', start: 'top 70%' }
  });

  /* ---------- Mapa: rede que se desenha ---------- */
  const mapTl = gsap.timeline({ paused: true });
  if (window.DrawSVGPlugin) {
    mapTl.fromTo('.sn-map__br', { drawSVG: '0%' }, { drawSVG: '100%', duration: 1.4, ease: 'power2.inOut' }, 0)
      .fromTo('.sn-map__links path', { drawSVG: '0%' }, { drawSVG: '100%', duration: 1, stagger: .12, ease: 'power2.out' }, .5);
  }
  mapTl
    .from('.sn-city--hub > circle:not(.sn-hub-pulse)', { scale: 0, transformOrigin: '50% 50%', duration: .8, ease: 'back.out(2)' }, .2)
    .from('.sn-city:not(.sn-city--hub) circle', { scale: 0, transformOrigin: '50% 50%', duration: .6, ease: 'back.out(2.4)', stagger: .12 }, .7)
    .from('.sn-city text, .sn-map__br-label', { opacity: 0, y: 8, duration: .6, stagger: .08 }, .8)
    .from('.sn-map__states text', { opacity: 0, duration: 1 }, 1.2);

  mm.add('(min-width: 1024px)', () => {
    mapTl.progress(0);
    ScrollTrigger.create({
      trigger: '.sn-map__pin', start: 'top top', end: '+=110%', pin: true, scrub: .8, animation: mapTl, anticipatePin: 1
    });
    gsap.to('.sn-map__topo', { rotate: 10, scale: 1.08, transformOrigin: '50% 50%', ease: 'none', scrollTrigger: { trigger: '.sn-map', start: 'top bottom', end: 'bottom top', scrub: true } });
  });
  mm.add('(max-width: 1023px)', () => {
    ScrollTrigger.create({ trigger: '.sn-map__fig', start: 'top 75%', once: true, onEnter: () => mapTl.play() });
  });

  /* ---------- Contadores ---------- */
  $$('[data-count]').forEach((el) => {
    const end = parseInt(el.dataset.count, 10);
    const pad = end < 10 ? 2 : String(end).length;
    const obj = { v: 0 };
    el.textContent = String(0).padStart(pad, '0');
    gsap.to(obj, {
      v: end, duration: end > 50 ? 2.2 : 1.4, ease: 'power3.out',
      scrollTrigger: { trigger: el, start: 'top 88%' },
      onUpdate: () => { el.textContent = String(Math.round(obj.v)).padStart(pad, '0'); }
    });
  });

  /* ---------- Palestrantes ---------- */
  $$('[data-speaker]').forEach((card, i) => {
    const frame = $('.sn-speaker__frame', card);
    const img = $('img', frame);
    gsap.timeline({ scrollTrigger: { trigger: card, start: 'top 85%' } })
      .fromTo(card, { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 1.4, ease: 'expo.out', delay: i * .08 }, 0)
      .fromTo(img, { scale: 1.18, yPercent: 8 }, { scale: 1, yPercent: 0, duration: 1.8, ease: 'expo.out' }, 0);
  });
  mm.add('(min-width: 640px)', () => {
    $$('[data-speed]').forEach((el) => {
      const speed = parseFloat(el.dataset.speed) || 0;
      if (el.classList.contains('sn-hero__horizon')) return;
      gsap.fromTo(el, { y: () => -speed * window.innerHeight }, {
        y: () => speed * window.innerHeight, ease: 'none',
        scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: true, invalidateOnRefresh: true }
      });
    });
  });

  /* ---------- Programação: linha do tempo ---------- */
  $$('.sn-timeline').forEach((tl) => {
    gsap.fromTo(tl, { '--p': 0 }, {
      '--p': 1, ease: 'none',
      scrollTrigger: { trigger: tl, start: 'top 75%', end: 'bottom 55%', scrub: true }
    });
    gsap.from($$('li', tl), {
      opacity: 0, x: -20, duration: 1, ease: 'expo.out', stagger: .12,
      scrollTrigger: { trigger: tl, start: 'top 80%' }
    });
  });
  $$('[data-day]').forEach((day) => {
    ScrollTrigger.create({ trigger: day, start: 'top 65%', end: 'bottom 35%', toggleClass: { targets: day, className: 'sn-is-active' } });
  });

  /* ---------- Final: título com escala ---------- */
  gsap.fromTo('.sn-finale__title', { scale: .9 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: '.sn-finale', start: 'top bottom', end: 'center center', scrub: true } });

  /* ---------- Friso: loop contínuo que reage à velocidade do scroll ---------- */
  $$('.sn-frieze__track').forEach((track) => {
    const sets = $$('.sn-frieze__set', track);
    const loop = gsap.to(track, { x: () => -sets[0].offsetWidth, duration: 30, ease: 'none', repeat: -1 });
    let boost;
    ScrollTrigger.create({
      onUpdate: (self) => {
        const v = Math.min(Math.abs(self.getVelocity()) / 400, 5);
        loop.timeScale(1 + v);
        if (boost) boost.kill();
        boost = gsap.to(loop, { timeScale: 1, duration: 1.2, ease: 'power2.out', delay: .1 });
      }
    });
  });

  /* ---------- Ajustes finais ---------- */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
  window.addEventListener('load', () => ScrollTrigger.refresh());

  // Abre direto na âncora (ex.: link de campanha para #inscricao)
  if (location.hash) {
    const t = document.getElementById(location.hash.slice(1));
    if (t) setTimeout(() => scrollToTarget(t), 300);
  }

  /* =========================================================
     FORMULÁRIO
     ========================================================= */
  function initForm() {
    const form = $('[data-form]');
    if (!form) return;
    const success = $('[data-success]');
    const status = $('.sn-form__status', form);
    const params = new URLSearchParams(location.search);

    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach((k) => {
      if (form.elements[k] && params.get(k)) form.elements[k].value = params.get(k);
    });
    if (form.elements.pagina) form.elements.pagina.value = location.href.split('#')[0];
    const pre = params.get('interesse');
    if (pre && ['smart', 'vip', 'expositor'].includes(pre)) setInterest(pre);

    // Máscara de telefone: (00) 00000-0000
    const phone = form.elements.whatsapp;
    phone.addEventListener('input', () => {
      const d = phone.value.replace(/\D/g, '').slice(0, 11);
      let out = d;
      if (d.length > 2) out = `(${d.slice(0, 2)}) ${d.slice(2)}`;
      if (d.length > 7) out = `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
      phone.value = out;
    });

    let started = false;
    form.addEventListener('focusin', () => {
      if (!started) { started = true; track('form_start', { form_id: 'lead-form' }); }
    });

    const rules = {
      nome: (v) => v.trim().length >= 3 && /\s/.test(v.trim()) ? '' : 'Informe seu nome completo.',
      whatsapp: (v) => { const d = v.replace(/\D/g, ''); return d.length >= 10 && d.length <= 11 ? '' : 'Informe um WhatsApp válido com DDD.'; },
      email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? '' : 'Informe um e-mail válido.',
      interesse: () => form.querySelector('input[name="interesse"]:checked') ? '' : 'Escolha uma opção.',
      consentimento: () => form.elements.consentimento.checked ? '' : 'É preciso autorizar o contato para continuar.'
    };

    const validate = (name) => {
      const msg = rules[name](form.elements[name].value ?? '');
      const field = (name === 'interesse' ? $('.sn-field--choices', form) : form.elements[name].closest('.sn-field'));
      const err = $(`#e-${name}`);
      field.classList.toggle('sn-is-invalid', !!msg);
      if (name !== 'interesse' && name !== 'consentimento') field.classList.toggle('sn-is-valid', !msg);
      if (err) err.textContent = msg;
      const input = name === 'interesse' ? null : form.elements[name];
      if (input) {
        input.setAttribute('aria-invalid', msg ? 'true' : 'false');
        if (err) input.setAttribute('aria-describedby', err.id);
      }
      return !msg;
    };

    ['nome', 'whatsapp', 'email'].forEach((n) => {
      form.elements[n].addEventListener('blur', () => { if (form.elements[n].value) validate(n); });
      form.elements[n].addEventListener('input', () => { if (form.elements[n].closest('.sn-field').classList.contains('sn-is-invalid')) validate(n); });
    });
    $$('input[name="interesse"]', form).forEach((r) => r.addEventListener('change', () => validate('interesse')));
    form.elements.consentimento.addEventListener('change', () => validate('consentimento'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = '';
      const ok = Object.keys(rules).map(validate).every(Boolean);
      if (!ok) {
        const first = $('.sn-is-invalid input', form);
        if (first) first.focus();
        track('form_error', { form_id: 'lead-form' });
        return;
      }
      if (form.elements.empresa_site.value) return; // honeypot

      const data = Object.fromEntries(new FormData(form).entries());
      delete data.empresa_site;
      data.whatsapp = data.whatsapp.replace(/\D/g, '');
      data.enviado_em = new Date().toISOString();

      form.classList.add('sn-is-loading');
      form.setAttribute('aria-busy', 'true');
      try {
        await sendLead(data);
        track('generate_lead', { form_id: 'lead-form', interesse: data.interesse });
        if (typeof window.fbq === 'function') window.fbq('track', 'Lead', { content_name: `Sertão Negócios · ${data.interesse}` });
        showSuccess(data.nome);
      } catch (err) {
        console.error(err);
        status.textContent = 'Não foi possível enviar agora. Verifique sua conexão e tente novamente.';
        track('form_submit_error', { form_id: 'lead-form' });
      } finally {
        form.classList.remove('sn-is-loading');
        form.removeAttribute('aria-busy');
      }
    });

    async function sendLead(data) {
      if (!CFG.leadEndpoint) {
        console.warn('[Sertão Negócios] leadEndpoint não configurado em assets/js/config.js. Envio simulado:', data);
        await new Promise((r) => setTimeout(r, 900));
        return;
      }
      const isForm = CFG.payloadFormat === 'form';
      const res = await fetch(CFG.leadEndpoint, {
        method: 'POST',
        mode: CFG.requestMode || 'cors',
        headers: { 'Content-Type': isForm ? 'application/x-www-form-urlencoded;charset=UTF-8' : 'application/json' },
        body: isForm ? new URLSearchParams(data).toString() : JSON.stringify(data)
      });
      // Em modo no-cors a resposta é opaca: considera enviado se não houve erro de rede.
      if (res.type !== 'opaque' && !res.ok) throw new Error(`HTTP ${res.status}`);
    }

    function showSuccess(nome) {
      const first = (nome || '').trim().split(/\s+/)[0];
      $('[data-success-name]').textContent = first ? `, ${first}` : '';
      form.hidden = true;
      success.hidden = false;
      success.focus();
      if (window.gsap && !reduceMotion) {
        gsap.from(success.children, { opacity: 0, y: 24, duration: .9, ease: 'expo.out', stagger: .08 });
      }
      if (CFG.redirectUrl) setTimeout(() => { location.href = CFG.redirectUrl; }, CFG.redirectDelayMs || 2000);
    }
  }

  /* =========================================================
     POLÍTICA DE PRIVACIDADE (dialog)
     ========================================================= */
  function initPrivacy() {
    const dlg = $('#privacy');
    if (!dlg || typeof dlg.showModal !== 'function') return;
    $$('[data-open-privacy]').forEach((b) => b.addEventListener('click', () => {
      dlg.showModal();
      if (lenis) lenis.stop();
    }));
    $('[data-close-privacy]', dlg).addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', () => { if (lenis) lenis.start(); });
  }
};
/* Encaixe automático no GreatPages
   O GreatPages posiciona cada elemento de forma absoluta, com altura fixa, dentro de blocos de altura
   fixa, e calcula a altura da página a partir dessas alturas. Este trecho:
   - estica cada elemento com uma seção do Sertão Negócios para a largura da tela e a altura do conteúdo;
   - põe o bloco no fluxo normal da página, com a altura do conteúdo;
   - libera a altura das caixas em volta (a página cresce junto) e troca "overflow: hidden" por "clip"
     (corta igual, mas não quebra o efeito de "ficar parado" no scroll);
   - avisa o scroll suave (Lenis) e o ScrollTrigger quando a altura da página muda. */
var __snFit = (function () {
  var pending = false, lastDocH = 0;

  function imp(el, prop, val) { el.style.setProperty(prop, val, 'important'); }

  function absWrapper(root) {
    var el = root.parentElement, i = 0;
    while (el && el !== document.body && i++ < 10) {
      if (getComputedStyle(el).position === 'absolute') return el;
      el = el.parentElement;
    }
    return null;
  }

  function fit() {
    pending = false;
    var vw = document.documentElement.clientWidth;
    var done = [];
    document.querySelectorAll('.sn').forEach(function (root) {
      var el = absWrapper(root);
      if (!el || done.indexOf(el) > -1) return;
      done.push(el);
      var block = el.offsetParent;
      if (!block || block === document.body || block === document.documentElement) return;

      // Bloco no fluxo normal (o GreatPages pode posicioná-lo de forma absoluta)
      var bcs = getComputedStyle(block);
      if (bcs.position === 'absolute' || bcs.position === 'fixed') {
        imp(block, 'position', 'relative');
        imp(block, 'top', 'auto');
        imp(block, 'bottom', 'auto');
      }
      imp(block, 'overflow', 'visible');
      imp(block, 'max-height', 'none');

      // Elemento: altura do conteúdo, largura da tela
      imp(el, 'height', 'auto');
      imp(el, 'min-height', '0');
      imp(el, 'max-height', 'none');
      imp(el, 'overflow', 'visible');
      imp(el, 'top', '0');
      imp(el, 'bottom', 'auto');
      imp(el, 'left', (-block.getBoundingClientRect().left) + 'px');
      imp(el, 'width', vw + 'px');
      imp(el, 'max-width', 'none');

      // Bloco: altura do conteúdo
      var h = el.offsetHeight;
      imp(block, 'height', h + 'px');
      imp(block, 'min-height', h + 'px');

      // Caixas acima do bloco, até o body: no fluxo normal, com altura livre e corte sem quebrar o sticky
      var a = block.parentElement, i = 0;
      while (a && a !== document.body && a !== document.documentElement && i++ < 12) {
        var cs = getComputedStyle(a);
        if (cs.position === 'absolute' || cs.position === 'fixed') {
          imp(a, 'position', 'relative');
          imp(a, 'top', 'auto');
          imp(a, 'bottom', 'auto');
        }
        imp(a, 'height', 'auto');
        imp(a, 'max-height', 'none');
        if (cs.overflowX === 'hidden' || cs.overflowY === 'hidden') imp(a, 'overflow', 'clip');
        a = a.parentElement;
      }
    });

    // A página mudou de altura: atualiza o scroll suave e as animações de scroll
    var docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if (docH !== lastDocH) {
      lastDocH = docH;
      clearTimeout(fit._t);
      fit._t = setTimeout(function () {
        if (window.__snLenis) window.__snLenis.resize();
        if (window.ScrollTrigger) ScrollTrigger.refresh();
      }, 120);
    }
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(fit);
  }

  function start() {
    fit();
    window.addEventListener('resize', schedule);
    window.addEventListener('load', schedule);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(schedule);
      document.querySelectorAll('.sn').forEach(function (r) { ro.observe(r); });
    }
    // O GreatPages pode recalcular o layout depois de carregar: confere de novo nos primeiros segundos
    var n = 0, iv = setInterval(function () { schedule(); if (++n >= 12) clearInterval(iv); }, 500);
  }

  return start;
})();

/* Modo diagnóstico: abra a página publicada com ?sn-debug=1 no fim do link */
(function () {
  if (!/[?&]sn-debug/.test(location.search)) return;
  function desc(n) {
    if (!n || n === document) return '-';
    var c = (typeof n.className === 'string' && n.className.trim()) ? '.' + n.className.trim().split(/\s+/).slice(0, 2).join('.') : '';
    return n.tagName.toLowerCase() + (n.id ? '#' + n.id.slice(0, 24) : '') + c;
  }
  function report() {
    var L = [], se = document.scrollingElement || document.documentElement;
    var hs = getComputedStyle(document.documentElement), bs = getComputedStyle(document.body);
    L.push('SN debug · ' + location.hostname + location.pathname);
    L.push('tela ' + innerWidth + 'x' + innerHeight + ' · dpr ' + devicePixelRatio + ' · ' + navigator.userAgent.slice(0, 60));
    L.push('pagina: scrollHeight ' + se.scrollHeight + ' · scrollY ' + Math.round(scrollY) + ' · lenis ' + (window.__snLenis ? 'sim (limite ' + Math.round(window.__snLenis.limit) + ')' : 'nao'));
    L.push('html: overflow ' + hs.overflowY + ' altura ' + document.documentElement.offsetHeight + ' · body: overflow ' + bs.overflowY + ' altura ' + document.body.offsetHeight + ' classe "' + document.body.className + '"');
    var ids = {};
    document.querySelectorAll('.sn').forEach(function (r) { if (r.id) ids[r.id] = (ids[r.id] || 0) + 1; });
    var dup = Object.keys(ids).filter(function (k) { return ids[k] > 1; });
    L.push('secoes repetidas: ' + (dup.length ? dup.join(', ') : 'nenhuma'));
    L.push('secoes na ordem do codigo (topo na pagina / altura / visivel):');
    document.querySelectorAll('section.sn, footer.sn').forEach(function (r) {
      var rect = r.getBoundingClientRect(), vis = r.offsetParent !== null && rect.height > 0;
      var el = r.parentElement, chain = [], i = 0;
      while (el && el !== document.body && i++ < 4) { var cs = getComputedStyle(el); chain.push(desc(el) + '[' + cs.position[0] + (cs.display === 'none' ? ',oculto' : '') + ',' + el.offsetHeight + ']'); el = el.parentElement; }
      L.push(' - ' + (r.id || desc(r)) + ': ' + Math.round(rect.top + scrollY) + ' / ' + Math.round(rect.height) + ' / ' + (vis ? 'sim' : 'NAO') + ' | ' + chain.join(' < '));
    });
    return L.join('\n');
  }
  function show() {
    var box = document.getElementById('sn-debug');
    if (!box) {
      box = document.createElement('div');
      box.id = 'sn-debug';
      box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;max-height:55vh;overflow:auto;background:#090c3a;color:#fff;border:2px solid #e02b1b;border-radius:12px;padding:10px;font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word';
      var btn = document.createElement('button');
      btn.textContent = 'Copiar diagnostico';
      btn.style.cssText = 'display:block;margin:0 0 8px;padding:8px 12px;border:0;border-radius:999px;background:#e02b1b;color:#fff;font:700 13px system-ui,sans-serif';
      var pre = document.createElement('div');
      box.appendChild(btn); box.appendChild(pre); document.body.appendChild(box);
      btn.addEventListener('click', function () {
        var t = report(); pre.textContent = t;
        try { navigator.clipboard.writeText(t).then(function () { btn.textContent = 'Copiado!'; }, sel); } catch (e) { sel(); }
        function sel() { var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Texto selecionado: copie'; }
      });
    }
    box.lastChild.textContent = report();
  }
  window.addEventListener('load', function () { setTimeout(show, 3000); });
  setTimeout(show, 6000);
})();
  const __snBoot = () => { __snFit(); __snRun(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __snBoot);
  else __snBoot();
}
