<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Escala do Louvor</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="description" content="Escala quinzenal ou mensal do grupo de louvor: quem serve e quais músicas em cada culto." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Layout: uma coluna de leitura confortável. No celular, barra de navegação embaixo
     (alcance do polegar) e edição em painéis que sobem da base; no computador, abas no
     topo e os mesmos painéis centralizados. Cores da identidade da IEC Pombal. */
  :root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --surface-3: #e3e8f0;
    --ink: #142036;
    --ink-2: #3b475d;
    --muted: #5f6b80;
    --line: #dde3ec;
    --brand: #195691;
    --brand-soft: #e4eef8;
    --brand-ink: #ffffff;
    --band: #0b2447;
    --band-ink: #f1f5fb;
    --band-muted: #a9bbd6;
    --gold: #ffcc00;
    --gold-ink: #2a2100;
    --ok: #1b7a4a;
    --ok-soft: #e2f3ea;
    --warn: #8a5600;
    --warn-soft: #fff1d1;
    --err: #b3261e;
    --err-soft: #fbe5e3;
    --scrim: rgba(8, 18, 36, 0.5);
    --shadow-1: 0 1px 2px rgba(11, 36, 71, 0.06);
    --shadow-2: 0 12px 32px -12px rgba(11, 36, 71, 0.28);

    --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;

    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --toque: 44px;
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1424;
      --surface: #121e33;
      --surface-2: #18263e;
      --surface-3: #22324d;
      --ink: #e8edf6;
      --ink-2: #c4cedd;
      --muted: #9aa8bf;
      --line: #243552;
      --brand: #84b6ee;
      --brand-soft: #1b3150;
      --brand-ink: #0b1424;
      --band: #081a33;
      --band-ink: #eef3fb;
      --band-muted: #93a8c8;
      --ok: #74d6a4;
      --ok-soft: #133222;
      --warn: #f2c460;
      --warn-soft: #33280d;
      --err: #ff958c;
      --err-soft: #3b1715;
      --scrim: rgba(0, 0, 0, 0.6);
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-2: 0 16px 40px -12px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1424;
    --surface: #121e33;
    --surface-2: #18263e;
    --surface-3: #22324d;
    --ink: #e8edf6;
    --ink-2: #c4cedd;
    --muted: #9aa8bf;
    --line: #243552;
    --brand: #84b6ee;
    --brand-soft: #1b3150;
    --brand-ink: #0b1424;
    --band: #081a33;
    --band-ink: #eef3fb;
    --band-muted: #93a8c8;
    --ok: #74d6a4;
    --ok-soft: #133222;
    --warn: #f2c460;
    --warn-soft: #33280d;
    --err: #ff958c;
    --err-soft: #3b1715;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 16px 40px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 500 16px/1.5 var(--f-body);
    min-height: 100vh;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
    -webkit-tap-highlight-color: transparent;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--brand); font-weight: 600; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  p { margin: 0; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 880px; margin: 0 auto; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }
  .num { font-variant-numeric: tabular-nums; }
  .rotulo { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ------------------------------------------------------------- topo */
  .topo { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  .topo .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .marca b, .marca span { white-space: nowrap; }
  .marca b { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.1; display: block; }
  .marca span { color: var(--band-muted); font-size: 0.8rem; display: block; }
  .salvo { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--band-muted); }
  .salvo i { width: 8px; height: 8px; border-radius: 50%; background: #5fd39a; display: inline-block; }
  .salvo[data-estado="salvando"] i { background: var(--gold); }
  .salvo[data-estado="erro"] i { background: #ff8f86; }

  /* navegação: barra inferior no celular, abas no topo no computador */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .nav button { border: 0; background: none; color: var(--muted); height: var(--nav-h); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 0.75rem; font-weight: 700; }
  .nav button .pilula { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background 0.2s; }
  body.sem-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .nav button[aria-current="page"] { color: var(--ink); }
  .nav button[aria-current="page"] .pilula { background: var(--brand-soft); color: var(--brand); }
  @media (min-width: 760px) {
    body { padding-bottom: 48px; }
    .nav { position: static; display: flex; gap: 4px; background: none; border: 0; padding: 0; }
    .nav button { height: 60px; display: flex; gap: 8px; padding: 0 12px; font-size: 0.92rem; color: var(--band-muted); border-bottom: 3px solid transparent; border-radius: 0; }
    .nav button .pilula { width: auto; height: auto; background: none !important; color: inherit !important; }
    .nav button[aria-current="page"] { color: var(--band-ink); border-bottom-color: var(--gold); }
    .nav button:hover { color: var(--band-ink); }
  }

  main { padding-block: 20px; }
  .tela { display: grid; gap: 16px; }
  .tela > * { min-width: 0; }
  .cabecalho { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cabecalho h1 { font-size: 1.6rem; }

  /* --------------------------------------------------------- controles */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--toque);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px; border-radius: 999px;
    font-weight: 700; font-size: 0.95rem; line-height: 1.2; white-space: nowrap; transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { border-color: var(--brand); }
  .btn.primario { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.primario:hover { filter: brightness(1.07); }
  .btn.tonal { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
  .btn.texto { border-color: transparent; background: transparent; color: var(--brand); padding: 0 10px; }
  .btn.texto:hover { background: var(--brand-soft); }
  .btn.perigo { color: var(--err); }
  .btn.icone { width: var(--toque); padding: 0; border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.icone:hover { background: var(--surface-2); }
  .btn.largo { width: 100%; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .campo { display: grid; gap: 6px; font-size: 0.875rem; font-weight: 700; color: var(--ink-2); min-width: 0; }
  .campo .ajuda { font-weight: 500; color: var(--muted); font-size: 0.8rem; }
  input[type="text"], input[type="search"], input[type="date"], input[type="month"], input[type="time"], input[type="url"], select, textarea {
    width: 100%; min-width: 0; min-height: var(--toque); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: var(--r-sm); padding: 10px 12px; font-weight: 500; font-size: 1rem;
  }
  textarea { resize: vertical; min-height: 88px; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
  .busca { position: relative; }
  .busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .busca input { padding-left: 42px; border-radius: 999px; background: var(--surface); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 0 14px; font-size: 0.875rem; font-weight: 700; color: var(--ink-2);
  }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .chip.apoio { border-style: dashed; border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .chip svg.i { width: 16px; height: 16px; }
  .rolagem-x { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
  .rolagem-x::-webkit-scrollbar { display: none; }
  .rolagem-x .chip { flex: none; }

  .selo { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.03em; white-space: nowrap; }
  .selo.solene { background: var(--gold); color: var(--gold-ink); }
  .selo.ok { background: var(--ok-soft); color: var(--ok); }
  .selo.alerta { background: var(--warn-soft); color: var(--warn); }
  .selo.erro { background: var(--err-soft); color: var(--err); }
  .selo.neutro { background: var(--surface-2); color: var(--muted); }

  .interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toque); font-weight: 700; color: var(--ink-2); cursor: pointer; }
  .interruptor input { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--surface-3); position: relative; flex: none; cursor: pointer; transition: background 0.2s; margin: 0; }
  .interruptor input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1); transition: transform 0.2s; }
  .interruptor input:checked { background: var(--brand); }
  .interruptor input:checked::after { transform: translateX(20px); background: var(--brand-ink); }
  .interruptor small { display: block; font-weight: 500; color: var(--muted); font-size: 0.8rem; }

  .passo { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .passo button { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; font-size: 1.25rem; font-weight: 700; color: var(--brand); }
  .passo button:disabled { color: var(--muted); opacity: 0.5; }
  .passo output { min-width: 28px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }

  .segmentado { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .segmentado button { border: 0; background: none; border-radius: 999px; min-height: 36px; padding: 0 14px; font-weight: 700; font-size: 0.875rem; color: var(--muted); }
  .segmentado button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

  /* -------------------------------------------------------- superfícies */
  .cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); min-width: 0; }
  .secao { display: grid; gap: 12px; padding: 16px; }
  .secao + .secao { border-top: 1px solid var(--line); }
  .lista { list-style: none; margin: 0; padding: 0; }
  .linha {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 60px;
    padding: 10px 16px; border: 0; background: none; text-align: left; color: inherit;
  }
  .lista > li + li { border-top: 1px solid var(--line); }
  .lista.cartao { overflow: hidden; }
  button.linha:hover { background: var(--surface-2); }
  .linha .titulo { font-weight: 700; overflow-wrap: anywhere; }
  .linha .sub { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-weight: 800; font-family: var(--f-display); }
  .marcador { min-width: 52px; height: 40px; padding: 0 6px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-weight: 800; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .marcador.louvor { background: var(--brand-soft); color: var(--brand); }

  .vazio { border: 2px dashed var(--line); border-radius: var(--r-lg); padding: 32px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; color: var(--muted); }
  .vazio h2 { color: var(--ink); font-size: 1.25rem; }
  .vazio p { max-width: 46ch; }

  /* ----------------------------------------------------------- escala */
  .seletor-escala { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px; }
  .seletor-escala button.periodo { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 2px; min-width: 0; }
  .seletor-escala .periodo b { font-family: var(--f-display); font-size: 1.45rem; display: inline-flex; align-items: center; gap: 6px; }
  .resumo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 16px 16px; }
  .resumo .btn.primario { flex: 1 1 220px; }
  .resumo > * { min-width: 0; }

  .dia { display: grid; gap: 10px; }
  .dia > h2 { font-size: 1rem; color: var(--ink-2); font-family: var(--f-body); font-weight: 800; padding-inline: 4px; }
  .culto { overflow: hidden; scroll-margin-top: 80px; }
  .culto.destaque { box-shadow: 0 0 0 3px var(--gold), var(--shadow-2); }
  .culto-cab { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 14px 8px 4px 16px; }
  .culto-cab h3 { font-size: 1.1rem; }
  .culto-cab .horarios { display: grid; gap: 2px; }
  .culto-cab .horario { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .culto-cab .selos { display: flex; gap: 6px; margin-top: 4px; }
  .culto-cab .hora { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--brand); }
  .culto .bloco { padding: 8px 16px 14px; display: grid; gap: 8px; }
  .culto .bloco + .bloco { border-top: 1px solid var(--line); padding-top: 12px; }
  .bloco-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 36px; }
  .funcoes { display: grid; gap: 8px; }
  .funcao { display: grid; grid-template-columns: minmax(0, 92px) minmax(0, 1fr); gap: 10px; align-items: center; }
  @media (max-width: 420px) { .funcao { grid-template-columns: minmax(0, 76px) minmax(0, 1fr); } .funcao > span { font-size: 0.8rem; } }
  .funcao > span { font-size: 0.85rem; color: var(--muted); font-weight: 700; }
  .pessoa {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface-2); font-weight: 700; font-size: 0.95rem; color: var(--ink);
  }
  .pessoa:hover { border-color: var(--brand); }
  .pessoa.vazia { background: none; border-style: dashed; color: var(--muted); font-style: italic; font-weight: 600; }
  .pessoa[data-nivel="erro"], .musica[data-nivel="erro"] { border-color: var(--err); background: var(--err-soft); }
  .pessoa[data-nivel="alerta"], .musica[data-nivel="alerta"] { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-soft); }
  .pessoa svg.i, .musica .fixa svg.i { width: 15px; height: 15px; color: var(--brand); }
  .pessoa.leitura { cursor: default; }
  .pessoa.leitura:hover { border-color: var(--line); }

  ol.musicas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: m; }
  ol.musicas > li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; counter-increment: m; }
  ol.musicas > li::before { content: counter(m); font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--brand); text-align: center; font-variant-numeric: tabular-nums; }
  .musica {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; text-align: left; min-height: 52px; padding: 8px 12px;
    border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: inherit; width: 100%;
  }
  .musica:hover { border-color: var(--brand); }
  .musica b { font-weight: 700; overflow-wrap: anywhere; }
  .musica .sub { font-size: 0.78rem; color: var(--muted); grid-column: 1; }
  .musica.vazia b { color: var(--muted); font-style: italic; font-weight: 600; }
  .musica .fixa { grid-row: 1 / span 2; grid-column: 2; }
  .ordem { display: flex; }
  .ordem .btn.icone { width: 36px; min-height: 36px; }
  .nota { font-size: 0.9rem; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 12px; white-space: pre-wrap; }

  /* --------------------------------------------------- disponibilidade */
  .nomes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
  .nomes .btn { justify-content: flex-start; border-radius: var(--r-md); min-height: 52px; }
  .calendario { display: grid; gap: 20px; }
  .mes h3 { font-size: 1rem; margin-bottom: 8px; }
  .semana, .grade-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .semana span { text-align: center; font-size: 0.75rem; font-weight: 800; color: var(--muted); padding-bottom: 2px; }
  .grade-dias > span, .dia-culto { aspect-ratio: 1 / 1.05; max-width: 100%; border-radius: var(--r-sm); display: grid; place-items: center; align-content: center; gap: 0; font-variant-numeric: tabular-nums; }
  .dia-fora { color: var(--muted); opacity: 0.55; font-size: 0.9rem; }
  .dia-culto { border: 1.5px solid var(--brand); background: var(--surface); color: var(--ink); padding: 2px; position: relative; }
  .dia-culto b { font-size: 1.05rem; line-height: 1.1; }
  .dia-culto small { font-size: 0.62rem; font-weight: 700; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .dia-culto[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .dia-culto[aria-pressed="true"] small { color: var(--surface); opacity: 0.9; }
  .dia-culto svg.i { position: absolute; top: 3px; right: 3px; width: 13px; height: 13px; stroke-width: 3; }
  .barra-envio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .barra-envio .btn { max-width: 560px; margin: 0 auto; display: flex; min-height: 52px; font-size: 1.02rem; }
  .progresso { display: grid; gap: 6px; }
