<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Escala do Louvor</title>
<meta name="description" content="Escala do grupo de louvor da IEC Pombal: quem serve e quais músicas em cada culto." />
<meta name="theme-color" content="#0B2345" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Escala" />
<link rel="icon" href="marca/marca.svg" type="image/svg+xml" />
<link rel="icon" href="marca/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="marca/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preload" href="fontes/inter.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fontes/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* ============================================================ fontes */
  @font-face { font-family: "Inter"; src: url("fontes/inter.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Plus Jakarta Sans"; src: url("fontes/plus-jakarta-sans.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }

  /* ============================================================ tokens
     Identidade da Escala do Louvor (IEC Pombal): azul-marinho institucional, azul
     de ação e o dourado como assinatura (marca, indicadores, item ativo). */
  :root {
    --navy: #0b2345;
    --navy-2: #12305a;
    --azul: #1e5a96;
    --azul-forte: #184c80;
    --azul-suave: #e9f1fa;
    --azul-linha: #c9dbef;
    --dourado: #f5be22;
    --dourado-suave: #fdf3d3;
    --dourado-tinta: #6b4d00;

    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #f1f4f8;
    --surface-3: #e6ebf2;
    --ink: #14243b;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e3e8ef;
    --line-2: #d3dbe6;

    --ok: #157347;
    --ok-suave: #e3f4ea;
    --alerta: #8a5a00;
    --alerta-suave: #fdf1d6;
    --erro: #b42318;
    --erro-suave: #fdecea;
    --veu: rgba(11, 35, 69, 0.45);

    --sombra-1: 0 1px 2px rgba(16, 24, 40, 0.05);
    --sombra-2: 0 1px 3px rgba(16, 24, 40, 0.07), 0 1px 2px rgba(16, 24, 40, 0.04);
    --sombra-3: 0 24px 48px -16px rgba(11, 35, 69, 0.28), 0 2px 6px rgba(11, 35, 69, 0.06);

    --f-titulo: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-texto: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;

    /* escala tipográfica */
    --t-xs: 0.75rem;   /* 12 */
    --t-sm: 0.8125rem; /* 13 */
    --t-md: 0.9375rem; /* 15 */
    --t-lg: 1.0625rem; /* 17 */
    --t-xl: 1.25rem;   /* 20 */
    --t-2xl: 1.5rem;   /* 24 */
    --t-3xl: 1.75rem;  /* 28 */

    /* espaçamento (4 pt) */
    --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-5: 20px; --e-6: 24px; --e-8: 32px;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-full: 999px;
    --toque: 44px;
    --nav-h: 64px;
    --topo-h: 56px;
    --lateral-w: 256px;
    --rapido: 160ms;
    --curva: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --azul: #7fb0e8; --azul-forte: #9cc3ef; --azul-suave: #16304f; --azul-linha: #27476d;
      --dourado-suave: #3a2f0f; --dourado-tinta: #f5cf63;
      --bg: #0a1626; --surface: #101f35; --surface-2: #15263f; --surface-3: #1d304d;
      --ink: #e7edf5; --ink-2: #c3cede; --muted: #94a3b8; --line: #1f3350; --line-2: #2a4264;
      --ok: #6fd3a0; --ok-suave: #12301f; --alerta: #f2c45e; --alerta-suave: #33290c; --erro: #ff9b91; --erro-suave: #3a1714;
      --veu: rgba(0, 0, 0, 0.6);
      --sombra-1: 0 1px 2px rgba(0, 0, 0, 0.3); --sombra-2: 0 1px 3px rgba(0, 0, 0, 0.4); --sombra-3: 0 24px 48px -16px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --azul: #7fb0e8; --azul-forte: #9cc3ef; --azul-suave: #16304f; --azul-linha: #27476d;
    --dourado-suave: #3a2f0f; --dourado-tinta: #f5cf63;
    --bg: #0a1626; --surface: #101f35; --surface-2: #15263f; --surface-3: #1d304d;
    --ink: #e7edf5; --ink-2: #c3cede; --muted: #94a3b8; --line: #1f3350; --line-2: #2a4264;
    --ok: #6fd3a0; --ok-suave: #12301f; --alerta: #f2c45e; --alerta-suave: #33290c; --erro: #ff9b91; --erro-suave: #3a1714;
    --veu: rgba(0, 0, 0, 0.6);
    --sombra-1: 0 1px 2px rgba(0, 0, 0, 0.3); --sombra-2: 0 1px 3px rgba(0, 0, 0, 0.4); --sombra-3: 0 24px 48px -16px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }

  /* ============================================================ base */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 var(--t-md)/1.55 var(--f-texto); font-feature-settings: "cv11", "ss01";
    min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  a { color: var(--azul); font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: var(--r-sm); }
  h1, h2, h3 { font-family: var(--f-titulo); font-weight: 700; margin: 0; letter-spacing: -0.015em; text-wrap: balance; color: var(--ink); }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: var(--t-sm); }
  .num { font-variant-numeric: tabular-nums; }
  .rotulo { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* ============================================================ moldura
     Celular: barra superior compacta + navegação inferior fixa.
     Computador (≥ 960 px): menu lateral fixo e conteúdo em grade. */
  .moldura { min-height: 100vh; min-height: 100dvh; }
  .lateral { display: none; }
  .topo {
    position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid transparent; padding-top: env(safe-area-inset-top, 0px);
    transition: border-color var(--rapido);
  }
  .topo.rolou { border-bottom-color: var(--line); }
  .topo-dentro { display: flex; align-items: center; gap: var(--e-3); min-height: var(--topo-h); padding: 0 max(var(--e-4), env(safe-area-inset-right, 0px)) 0 max(var(--e-4), env(safe-area-inset-left, 0px)); max-width: 1240px; margin: 0 auto; }
  .marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; text-decoration: none; color: inherit; }
  .marca img { width: 32px; height: 32px; flex: none; border-radius: 8px; }
  .marca b { display: block; font-family: var(--f-titulo); font-weight: 700; font-size: var(--t-lg); line-height: 1.15; letter-spacing: -0.02em; white-space: nowrap; }
  .marca small { display: block; font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .topo-titulo { display: none; }

  .salvo {
    display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: var(--r-full);
    font-size: var(--t-xs); font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
  }
  .salvo i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .salvo[data-estado="salvando"] i { background: var(--dourado); }
  .salvo[data-estado="offline"] { color: var(--alerta); border-color: color-mix(in srgb, var(--alerta) 40%, transparent); background: var(--alerta-suave); }
  .salvo[data-estado="offline"] i { background: var(--alerta); }
  .salvo[data-estado="erro"] { color: var(--erro); border-color: color-mix(in srgb, var(--erro) 40%, transparent); background: var(--erro-suave); }
  .salvo[data-estado="erro"] i { background: var(--erro); }
  @media (prefers-reduced-motion: no-preference) { .salvo[data-estado="salvando"] i { animation: pulsa 1s ease-in-out infinite; } }
  @keyframes pulsa { 50% { opacity: 0.35; } }

  .conteudo { padding: var(--e-4) max(var(--e-4), env(safe-area-inset-right, 0px)) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + var(--e-8)) max(var(--e-4), env(safe-area-inset-left, 0px)); max-width: 1240px; margin: 0 auto; }
  body.sem-nav .conteudo { padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }

  /* navegação inferior */
  .nav-inferior {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .nav-inferior button {
    border: 0; background: none; color: var(--muted); height: var(--nav-h); display: grid; place-items: center; align-content: center; gap: 3px;
    font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.01em; position: relative;
  }
  .nav-inferior .pilula { display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--r-full); transition: background var(--rapido), color var(--rapido); }
  .nav-inferior svg.i { width: 21px; height: 21px; }
  .nav-inferior button[aria-current="page"] { color: var(--ink); }
  .nav-inferior button[aria-current="page"] .pilula { background: var(--azul-suave); color: var(--azul); }
  .nav-inferior button[aria-current="page"] .pilula::after { content: ""; position: absolute; top: 6px; margin-left: 30px; width: 6px; height: 6px; border-radius: 50%; background: var(--dourado); }

  /* menu lateral (computador) */
  @media (min-width: 960px) {
    .moldura { display: grid; grid-template-columns: var(--lateral-w) minmax(0, 1fr); background: linear-gradient(90deg, var(--navy) var(--lateral-w), transparent 0); }
    .lateral {
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--navy); color: #e8eef7;
      padding: var(--e-5) var(--e-3) var(--e-4);
    }
    .lateral .logo { display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px; color: inherit; text-decoration: none; }
    .lateral .logo img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
    .lateral .logo b { display: block; font-family: var(--f-titulo); font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; line-height: 1.2; }
    .lateral .logo small { display: block; font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; color: #8fa6c6; }
    .lateral .logo .traco { display: block; width: 22px; height: 3px; border-radius: 2px; background: var(--dourado); margin: 5px 0 4px; }
    .lateral nav { display: grid; gap: 2px; }
    .lateral nav button {
      display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 12px; border: 0; border-radius: var(--r-md); background: none;
      color: #b7c6dc; font-size: 0.9rem; font-weight: 500; text-align: left; position: relative; transition: background var(--rapido), color var(--rapido);
    }
    .lateral nav button:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .lateral nav button[aria-current="page"] { background: rgba(255, 255, 255, 0.1); color: #fff; font-weight: 600; }
    .lateral nav button[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--dourado); }
    .lateral nav button:focus-visible { outline-color: var(--dourado); }
    .lateral .rodape-lateral { margin-top: auto; display: grid; gap: 10px; padding: 12px 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: var(--t-xs); color: #8fa6c6; }
    .lateral .rodape-lateral b { color: #dbe4f0; font-weight: 600; font-size: var(--t-sm); }
    .nav-inferior { display: none; }
    .topo { background: color-mix(in srgb, var(--bg) 90%, transparent); }
    .topo .marca { display: none; }
    .topo-titulo { display: block; flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topo-titulo b { color: var(--ink); font-weight: 600; }
    .topo-dentro, .conteudo { padding-left: var(--e-8); padding-right: var(--e-8); }
    .conteudo { padding-top: var(--e-3); padding-bottom: var(--e-8); }
    body.sem-nav .conteudo { padding-bottom: 120px; }
  }

  /* ============================================================ telas */
  .tela { display: grid; gap: var(--e-4); }
  .tela > * { min-width: 0; }
  @media (prefers-reduced-motion: no-preference) { .tela.entra { animation: entra 220ms var(--curva); } }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } }
  .cabecalho { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--e-3); flex-wrap: wrap; padding-top: var(--e-1); }
  .cabecalho h1 { font-size: var(--t-2xl); line-height: 1.2; }
  .cabecalho p { margin-top: 2px; }
  @media (min-width: 960px) { .cabecalho h1 { font-size: var(--t-3xl); } }
  .grade-2 { display: grid; gap: var(--e-4); }
  @media (min-width: 760px) { .grade-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ============================================================ controles */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--toque); padding: 0 16px;
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: var(--r-md);
    font-weight: 600; font-size: var(--t-md); line-height: 1.2; white-space: nowrap; text-decoration: none;
    transition: background var(--rapido), border-color var(--rapido), color var(--rapido), transform 80ms;
  }
  .btn:hover { border-color: color-mix(in srgb, var(--azul) 50%, var(--line-2)); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; box-shadow: var(--sombra-1); }
  .btn.primario:hover { background: var(--azul-forte); border-color: var(--azul-forte); }
  :root[data-theme="dark"] .btn.primario { color: #0a1626; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primario { color: #0a1626; } }
  .btn.tonal { background: var(--azul-suave); border-color: transparent; color: var(--azul); }
  .btn.tonal:hover { background: color-mix(in srgb, var(--azul-suave) 70%, var(--azul-linha)); }
  .btn.texto { border-color: transparent; background: transparent; color: var(--azul); padding: 0 10px; }
  .btn.texto:hover { background: var(--azul-suave); }
  .btn.perigo { color: var(--erro); }
  .btn.perigo:hover { border-color: var(--erro); background: var(--erro-suave); }
  .btn.icone { width: var(--toque); padding: 0; border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.icone:hover { background: var(--surface-2); }
  .btn.largo { width: 100%; }
  .btn.mini { min-height: 34px; padding: 0 12px; font-size: var(--t-sm); border-radius: var(--r-sm); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn.zap { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
  .btn.zap:hover { background: #197a42; border-color: #197a42; }
  .acoes { display: flex; gap: var(--e-2); flex-wrap: wrap; align-items: center; }

  .campo { display: grid; gap: 6px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); min-width: 0; }
  .campo .ajuda { font-weight: 400; color: var(--muted); font-size: var(--t-sm); }
  input[type="text"], input[type="search"], input[type="date"], input[type="month"], input[type="time"], input[type="url"], input[type="password"], select, textarea {
    width: 100%; min-width: 0; min-height: var(--toque); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
    border-radius: var(--r-md); padding: 10px 12px; font-weight: 400; font-size: 1rem; transition: border-color var(--rapido), box-shadow var(--rapido);
  }
  textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { border-color: var(--azul); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--azul) 20%, transparent); }
  .busca { position: relative; }
  .busca > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .busca input { padding-left: 40px; }

  .chips { display: flex; flex-wrap: wrap; gap: var(--e-2); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; border: 1px solid var(--line-2); background: var(--surface);
    border-radius: var(--r-full); padding: 0 14px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); transition: background var(--rapido), border-color var(--rapido);
  }
  button.chip:hover { border-color: var(--azul); }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  :root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #0a1626; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #0a1626; } }
  .chip[aria-pressed="true"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dourado); margin-left: -4px; }
  .chip.apoio { border-style: dashed; border-color: var(--azul); color: var(--azul); background: var(--azul-suave); }
  .chip.apoio::before { display: none; }
  .chip svg.i { width: 15px; height: 15px; }
  .chip .conta { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
  .chip[aria-pressed="true"] .conta { color: #c9d6e8; }
  .rolagem-x { display: flex; gap: var(--e-2); overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; scroll-padding-inline: 16px; }
  .rolagem-x::-webkit-scrollbar { display: none; }
  .rolagem-x .chip { flex: none; }
  @media (min-width: 960px) { .rolagem-x { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; } }

  .selo { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 8px; border-radius: var(--r-full); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  .selo svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
  .selo.solene { background: var(--dourado-suave); color: var(--dourado-tinta); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dourado) 55%, transparent); }
  .selo.ok { background: var(--ok-suave); color: var(--ok); }
  .selo.alerta { background: var(--alerta-suave); color: var(--alerta); }
  .selo.erro { background: var(--erro-suave); color: var(--erro); }
  .selo.neutro { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
  .selo.azul { background: var(--azul-suave); color: var(--azul); }

  .interruptor { display: flex; align-items: center; justify-content: space-between; gap: var(--e-3); min-height: var(--toque); font-weight: 600; color: var(--ink-2); cursor: pointer; }
  .interruptor input { appearance: none; width: 44px; height: 26px; border-radius: var(--r-full); background: var(--surface-3); position: relative; flex: none; cursor: pointer; transition: background var(--rapido); margin: 0; box-shadow: inset 0 0 0 1px var(--line-2); }
