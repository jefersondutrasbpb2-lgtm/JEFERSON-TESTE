<!-- Sertão Negócios · TESTE DE DIAGNÓSTICO v2 · cole num elemento HTML/CSS, publique, abra o link publicado, role até o fim e clique em "Copiar resultado" -->
<div id="sn-probe" style="font:15px/1.5 system-ui,sans-serif;background:#090c3a;color:#fff;padding:24px;border-radius:14px;width:100%;box-sizing:border-box">
  <p style="margin:0 0 6px;font-weight:800;font-size:18px">Teste Sertão Negócios · v2</p>
  <p id="sn-probe-step" style="margin:0 0 12px;color:#ffd166;font-weight:700">1. Role a página até o fim do degradê e depois volte aqui.</p>
  <button id="sn-probe-copy" type="button" style="margin:0 0 12px;padding:10px 16px;border:0;border-radius:999px;background:#e02b1b;color:#fff;font:800 14px system-ui,sans-serif;cursor:pointer">Copiar resultado</button>
  <pre id="sn-probe-out" style="white-space:pre-wrap;word-break:break-word;margin:0 0 16px;padding:12px;background:#121666;border-radius:8px;font:12px/1.5 ui-monospace,monospace;min-height:40px;user-select:all">Se esta caixa continuar com este texto, o GreatPages não roda scripts dentro do elemento.</pre>
  <div id="sn-probe-track" style="position:relative;height:1400px;border-radius:10px;background:linear-gradient(#2a30e0,#ff3d2e);padding:16px;box-sizing:border-box">
    <div id="sn-probe-sticky" style="position:sticky;top:90px;display:inline-block;padding:10px 14px;background:#fff;color:#090c3a;border-radius:999px;font-weight:800">Selo com position: sticky</div>
    <div id="sn-probe-end" style="position:absolute;left:16px;bottom:16px;font-weight:800">Fim do teste (1.400 px)</div>
  </div>
</div>
<div id="sn-probe-fixed" style="position:fixed;left:12px;top:45%;z-index:99999;padding:8px 12px;border-radius:999px;background:#e02b1b;color:#fff;font:700 13px system-ui,sans-serif">Selo com position: fixed</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var probe = $('sn-probe'), out = $('sn-probe-out'), track = $('sn-probe-track'), sticky = $('sn-probe-sticky'), fixed = $('sn-probe-fixed'), endEl = $('sn-probe-end');
  var t0 = performance.now();
  var state = { scrollers: {}, stickyOk: null, fixedTop0: null, fixedMoved: false, reachedEnd: false, maxScroll: 0 };

  function desc(n) {
    if (!n || n === document) return 'janela';
    var c = (typeof n.className === 'string' && n.className.trim()) ? '.' + n.className.trim().split(/\s+/).slice(0, 3).join('.') : '';
    return n.tagName.toLowerCase() + (n.id ? '#' + n.id : '') + c;
  }
  function chain() {
    var lines = [], a = probe.parentElement, i = 0;
    while (a && i < 25) {
      var cs = getComputedStyle(a), st = a.getAttribute('style') || '';
      lines.push('  ' + desc(a) + ' | pos ' + cs.position + ' | overflow ' + cs.overflowX + '/' + cs.overflowY +
        ' | ' + a.offsetWidth + 'x' + a.offsetHeight + (cs.transform !== 'none' ? ' | transform' : '') +
        (st ? ' | style="' + st.slice(0, 120) + '"' : ''));
      if (a === document.documentElement) break;
      a = a.parentElement; i++;
    }
    return lines.join('\n');
  }
  function check() {
    var fr = fixed.getBoundingClientRect();
    if (state.fixedTop0 === null) state.fixedTop0 = fr.top;
    if (Math.abs(fr.top - state.fixedTop0) > 4) state.fixedMoved = true;
    var tr = track.getBoundingClientRect(), sr = sticky.getBoundingClientRect();
    if (tr.top < -200 && tr.bottom > 300) state.stickyOk = Math.abs(sr.top - 90) < 12;
    var er = endEl.getBoundingClientRect();
    if (er.top < window.innerHeight && er.bottom > 0) state.reachedEnd = true;
    var se = document.scrollingElement;
    state.maxScroll = Math.max(state.maxScroll, window.scrollY || 0, se ? se.scrollTop : 0, document.body.scrollTop || 0);
  }
  function wrapperInfo() {
    // primeira caixa em volta que corta o conteúdo
    var a = probe.parentElement, i = 0;
    while (a && a !== document.body && i < 25) {
      var cs = getComputedStyle(a);
      if (cs.overflowY !== 'visible' || cs.overflowX !== 'visible') {
        return desc(a) + ' (altura ' + a.offsetHeight + 'px, conteúdo do teste ' + probe.offsetHeight + 'px)';
      }
      a = a.parentElement; i++;
    }
    return 'nenhuma até o body';
  }
  function report() {
    check();
    var sc = Object.keys(state.scrollers);
    var L = [];
    L.push('Teste Sertão Negócios v2 · ' + Math.round((performance.now() - t0) / 1000) + 's após carregar');
    L.push('Endereço: ' + location.hostname + location.pathname);
    L.push('Dentro de iframe: ' + (window.self !== window.top ? 'SIM' : 'não'));
    L.push('Tela: ' + window.innerWidth + 'x' + window.innerHeight + ' · elemento: ' + probe.offsetWidth + 'px de largura');
    L.push('Classe do body agora: "' + document.body.className + '"');
    L.push('Quem rola a página: ' + (sc.length ? sc.join(', ') : 'ainda não rolou') + ' · window.scrollY máx: ' + state.maxScroll);
    L.push('Chegou ao fim do degradê: ' + (state.reachedEnd ? 'SIM' : 'não (role até o fim)'));
    L.push('Sticky funciona: ' + (state.stickyOk === null ? 'ainda não testado (role pelo degradê)' : state.stickyOk ? 'SIM' : 'NÃO'));
    L.push('Fixed funciona: ' + (state.maxScroll < 50 && !sc.length ? 'ainda não testado' : state.fixedMoved ? 'NÃO (o selo vermelho rolou junto)' : 'SIM'));
    L.push('Primeira caixa que corta o conteúdo: ' + wrapperInfo());
    L.push('Caixas em volta do elemento:\n' + chain());
    out.textContent = L.join('\n');
    if (state.reachedEnd && state.stickyOk !== null) $('sn-probe-step').textContent = '2. Pronto! Clique em "Copiar resultado" e cole na conversa.';
  }
  document.addEventListener('scroll', function (e) {
    state.scrollers[desc(e.target === document ? document : e.target)] = 1;
    check();
  }, true);
  var tick; document.addEventListener('scroll', function () { clearTimeout(tick); tick = setTimeout(report, 150); }, true);
  window.addEventListener('load', function () { setTimeout(report, 1500); });
  setTimeout(report, 3000);
  report();
  $('sn-probe-copy').addEventListener('click', function () {
    report();
    var txt = out.textContent, btn = this;
    function done(ok) { btn.textContent = ok ? 'Copiado!' : 'Selecione o texto e copie'; setTimeout(function () { btn.textContent = 'Copiar resultado'; }, 2500); }
    try { navigator.clipboard.writeText(txt).then(function () { done(true); }, function () { selectOut(); done(false); }); }
    catch (e) { selectOut(); done(false); }
    function selectOut() { var r = document.createRange(); r.selectNodeContents(out); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
})();
</script>
